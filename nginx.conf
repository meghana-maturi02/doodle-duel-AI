server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /quickdraw-data/ {
    rewrite ^/quickdraw-data/(.*)$ /quickdraw_dataset/full/simplified/$1 break;
    proxy_pass https://storage.googleapis.com;
    proxy_ssl_server_name on;
    proxy_set_header Host storage.googleapis.com;
    # The full Quick Draw files are 30+ MB; the app only needs the first
    # 400 KB to parse its reference sample, and Cloud Run limits responses.
    proxy_set_header Range "bytes=0-399999";
    proxy_cache_valid 200 1h;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
